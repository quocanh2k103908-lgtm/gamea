<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dino Game</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: Arial;
}
canvas { display: block; }

.menu {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    font-size: 18px;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="startMenu" class="menu">
    <h2>Dino Game</h2>
    <button onclick="startGame()">Start</button>
</div>

<div id="gameOverMenu" class="menu" style="display:none;">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button onclick="restart()">Chơi lại</button>
</div>

<div id="questionBox" class="menu" style="display:none;"></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ===== KHAI BÁO TRƯỚC =====
let groundY = 0;

// ===== RESIZE =====
function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - 120;
}
window.addEventListener("resize", resize);
resize();

// ===== LOAD IMAGE =====
const playerImg = new Image();
playerImg.src = "player.png";

const bgImg = new Image();
bgImg.src = "ok.jpg";

// ===== GAME =====
let player = {
    x:100,
    y:groundY - 80, // 🔥 FIX QUAN TRỌNG
    w:80,
    h:80,
    vy:0,
    jumping:false
};

let gravity = 1;
let obstacles = [];
let nextSpawn = 0;

let score = 0;
let lives = 3;
let asking = false;
let gameRunning = false;

// ===== JUMP =====
function jump(){
    if(!player.jumping && !asking && gameRunning){
        player.vy = -20;
        player.jumping = true;
    }
}

// PC
document.addEventListener("keydown", e=>{
    if(e.code==="Space") jump();
});

// MOBILE
canvas.addEventListener("touchstart", e=>{
    e.preventDefault();
    jump();
});

// CLICK
canvas.addEventListener("mousedown", jump);

// ===== START =====
function startGame(){
    document.getElementById("startMenu").style.display="none";

    player.y = groundY - player.h;
    player.vy = 0;
    obstacles = [];
    score = 0;
    lives = 3;
    nextSpawn = 0;

    gameRunning = true;
}

// ===== UPDATE =====
function update(){
    if(!gameRunning || asking) return;

    player.vy += gravity;
    player.y += player.vy;

    if(player.y >= groundY - player.h){
        player.y = groundY - player.h;
        player.jumping = false;
    }

    if(nextSpawn <= 0){
        let type = Math.random();

        if(type < 0.6){
            obstacles.push({x:canvas.width, y:groundY-60, w:40, h:60});
        } else {
            obstacles.push({x:canvas.width, y:groundY-60, w:40, h:60});
            obstacles.push({x:canvas.width+45, y:groundY-60, w:40, h:60});
        }

        nextSpawn = Math.random()*400 + 300;
    }

    obstacles.forEach(o=>o.x -= 8);
    nextSpawn -= 8;

    for(let o of obstacles){
        if(player.x < o.x+o.w &&
           player.x+player.w > o.x &&
           player.y < o.y+o.h &&
           player.y+player.h > o.y){
            gameOver();
        }
    }

    score++;

    if(score > 0 && score % 500 === 0 && !asking){
        askQuestion();
    }
}

// ===== DRAW =====
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(bgImg,0,0,canvas.width,canvas.height);
    ctx.drawImage(playerImg,player.x,player.y,player.w,player.h);

    ctx.fillStyle="green";
    obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));

    ctx.fillStyle="black";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+score,20,40);
    ctx.fillText("❤️".repeat(lives),20,80);
}

// ===== LOOP (LUÔN CHẠY) =====
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

// ===== GAME OVER =====
function gameOver(){
    gameRunning = false;
    document.getElementById("gameOverMenu").style.display="block";
    document.getElementById("finalScore").innerText = "Score: " + score;
}

// ===== RESET =====
function restart(){
    document.getElementById("gameOverMenu").style.display="none";
    startGame();
}

// ===== QUIZ =====
function askQuestion(){
    asking = true;

    let q = ["2+2=?", "5x5=?", "1+9=?"];
    let a = [["3","4","5","6"],["10","20","25","30"],["8","9","10","11"]];
    let correct = [1,2,2];

    let i = Math.floor(Math.random()*3);

    let box = document.getElementById("questionBox");
    box.style.display="block";

    let html = `<p>${q[i]}</p>`;
    a[i].forEach((opt,idx)=>{
        html += `<button onclick="answer(${idx},${correct[i]})">${opt}</button><br>`;
    });

    box.innerHTML = html;
}

function answer(i,c){
    if(i === c){
        asking = false;
        document.getElementById("questionBox").style.display="none";
    } else {
        lives--;
        if(lives <= 0){
            gameOver();
        } else {
            alert("Sai! Còn "+lives+" mạng");
            asking = false;
            document.getElementById("questionBox").style.display="none";
        }
    }
}
</script>

</body>
</html>
